name: Public source checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check shell syntax and Python syntax
        run: |
          bash -n packaging/verify.sh
          bash -n packaging/build-local.sh
          shellcheck packaging/*.sh
          python3 -m compileall -q packaging/consumer
          git diff --check
